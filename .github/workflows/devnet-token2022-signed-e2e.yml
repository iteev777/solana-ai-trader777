name: Trojan Token-2022 signed Devnet E2E

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dex-jupiter-noncustodial-execution-current
    paths:
      - devnet_token2022_signed_e2e.py
      - .github/workflows/devnet-token2022-signed-e2e.yml
      - token2022_inspector.py
      - ata_manager.py
      - requirements.txt

permissions:
  contents: read

jobs:
  token2022-signed-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signed Token-2022 ATA creation on Devnet
        env:
          TROJAN_DEVNET_TOKEN2022_SIGNED_E2E_ENABLED: "true"
        run: python devnet_token2022_signed_e2e.py
