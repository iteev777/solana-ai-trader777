name: DLMM parity regression
on:
  push:
    branches: [trojan/sequential-parity-review]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: DLMM quote regression tests
        run: python -m unittest discover -s tests -p 'test_meteora_dlmm_direct_quote.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
