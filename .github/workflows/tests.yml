name: Trojan V2 tests

on:
  # Tests are deliberately manual until the full parity audit is complete.
  # This prevents intermediate code commits from starting partial test runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trojan-v2-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Full unit-test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run full unit-test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
